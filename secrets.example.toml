# Copy this file to .streamlit/secrets.toml for local use. Never commit the copy.

# Fast local login. Generate a hash with:
# python scripts/generate_password_hash.py
[app_auth]
mode = "password"

[users.connor]
name = "Connor Denton"
email = "your.email@example.com"
password_hash = "pbkdf2_sha256$600000$REPLACE_ME$REPLACE_ME"

